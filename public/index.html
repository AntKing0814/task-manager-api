<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .5rem; }
    li { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; }
    li.done span { text-decoration: line-through; color: #888; }
    ul { list-style: none; padding: 0; }
    #error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Task Manager</h1>
  <form id="form">
    <input id="title" placeholder="New task" maxlength="100" required>
    <button>Add</button>
  </form>
  <p id="error"></p>
  <ul id="list"></ul>

  <script>
    const list = document.getElementById("list");
    const errorEl = document.getElementById("error");

    async function api(path, options) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
      if (!res.ok && res.status !== 204) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || "Request failed");
      }
      return res.status === 204 ? null : res.json();
    }

    async function load() {
      const tasks = await api("/api/tasks");
      list.innerHTML = "";
      for (const t of tasks) {
        const li = document.createElement("li");
        if (t.completed) li.className = "done";

        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = t.completed;
        box.onchange = () => act(() => api(`/api/tasks/${t.id}`, { method: "PUT", body: JSON.stringify({ completed: box.checked }) }));

        const label = document.createElement("span");
        label.textContent = t.title; // textContent (not innerHTML) prevents XSS

        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = () => act(() => api(`/api/tasks/${t.id}`, { method: "DELETE" }));

        li.append(box, label, del);
        list.append(li);
      }
    }

    async function act(fn) {
      errorEl.textContent = "";
      try { await fn(); await load(); } catch (e) { errorEl.textContent = e.message; }
    }

    document.getElementById("form").onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById("title");
      act(() => api("/api/tasks", { method: "POST", body: JSON.stringify({ title: input.value }) }))
        .then(() => (input.value = ""));
    };

    load();
  </script>
</body>
</html>
